<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Yasmin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">Yasmin</a>
            <nav aria-label="Primary">
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_projects' %}">Projects</a>
                <a href="{% url 'main:show_art' %}">Art Portfolio</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="portfolio-section" id="projects">
            <div class="container">
                <h2 class="section-badge">Projects</h2>

                <div class="project-grid">
                    {% for project in project_list %}
                    <article class="card project-card">
                        <img class="card-image" src="{{ project.image_url }}" alt="Photo of {{ project.title }}">
                        <h3>{{ project.title }}</h3>
                        <p>{{ project.description }}</p>
                        <a href="{{ project.play_url }}" class="btn-primary" target="_blank">Play / View</a>
                    </article>
                    {% empty %}
                    <p class="empty-state">Belum ada proyek yang ditambahkan.</p>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Yasmin. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
