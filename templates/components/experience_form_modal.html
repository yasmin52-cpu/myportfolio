<div id="add-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah experience"></button>

    <div class="project-form-modal__content" style="background: var(--paper); padding: 20px; border-radius: var(--radius); z-index: 100;">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah experience" style="float: right; cursor: pointer;">×</button>

        <h2 id="add-experience-modal-title">Tambah Experience Baru</h2>

        <form id="experience-form"
              method="post"
              action="{% url 'main:create_experience_ajax' %}"
              class="project-form">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="{{ field.id_for_label }}" style="display: block; margin-bottom: 5px;">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}

            <div class="project-form-modal__actions" style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="button"
                        class="btn-action btn-delete"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Experience</button>
            </div>
        </form>
    </div>
</div>
