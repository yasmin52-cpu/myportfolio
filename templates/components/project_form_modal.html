<div id="add-project-modal" 
     class="project-form-modal" 
     popover="auto" 
     role="dialog" 
     aria-modal="true" 
     aria-labelledby="add-project-modal-title">
    
    <button type="button" 
            class="project-form-modal__backdrop" 
            popovertarget="add-project-modal" 
            popovertargetaction="hide" 
            aria-label="Tutup form tambah proyek"></button>
            
    <div class="project-form-modal__content" style="background: var(--paper); padding: 20px; border-radius: var(--radius); z-index: 100;">
        <button type="button" 
                class="project-form-modal__close" 
                popovertarget="add-project-modal" 
                popovertargetaction="hide" 
                aria-label="Tutup form tambah proyek" style="float: right; cursor: pointer;">×</button>
        
        <h2 id="add-project-modal-title">Tambah Proyek Baru</h2>
        
        <form id="project-form" 
              method="post" 
              action="{% url 'main:create_project' %}" 
              class="project-form">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="{{ field.id_for_label }}" style="display: block; margin-bottom: 5px;">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error" style="color: red; font-size: 0.8rem;">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            
            <div class="project-form-modal__actions" style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="button" 
                        class="btn-action btn-delete" 
                        popovertarget="add-project-modal" 
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="btn-primary">Tambah Proyek</button>
            </div>
        </form>
    </div>
</div>
